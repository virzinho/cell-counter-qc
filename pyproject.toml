[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-counter-qc"
version = "0.1.0"
description = "Interpretable nuclei segmentation and image-quality stress testing"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-image>=0.26,<0.27", "pandas>=2.2,<3", "matplotlib>=3.8,<4", "Pillow>=10,<13", "PyYAML>=6,<7", "psutil>=5.9,<8"]

[project.optional-dependencies]
neural = ["stardist>=0.9,<0.10", "tensorflow-cpu>=2.16,<2.22"]
demo = ["streamlit>=1.65,<2"]
dev = ["pytest>=8,<10", "streamlit>=1.65,<2"]

[project.scripts]
cell-counter = "cell_counter.cli:main"

[tool.setuptools.packages.find]
include = ["cell_counter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
